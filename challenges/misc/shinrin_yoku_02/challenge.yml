name: "Shinrin yoku 02"
author: "Otaphoque"
description: |
   Time to touch grass! Go for a walk and really, I mean really, feel the nature around you.
   Il est l'heure de *toucher de l'herbe*! Allez marcher et vraiment, je veux dire vraiment, ressentez la nature autour de vous.

   How many tiles compose the roof of Macdonald (on the inside)?
   Combien de dalles composent le toit de Macdonald (vu de l'intérieur)?

   Format 
   flag{number} (in letters in english)
flags:
   - {
        type: "static",
        content: "flag{twenty-one}",
        data: "case_insensitive",
   }
tags:
   - shinrin_yoku