# Description of the challenge (Markdown supported).
description: Arion Ethica, de la caste des Justes, sème une graine de résistance -
    un arbuste numérique qui croît en sagesse et détient des tactiques de rébellion.

    La graine, ou le "seed", est planté le 15 Mars 2437 à 08:02:39.
    Selon Arion, la plante croît avec un mélange d'eau et d'un byte hasardeux.
    Si on enregistre sa croissance chaque jour pendant 12 jours, une tactique est révélée.


