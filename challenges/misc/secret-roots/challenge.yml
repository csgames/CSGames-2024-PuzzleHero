# Description of the challenge (Markdown supported).
description: 
    Arion Ethica, from the caste of the Just, plants a seed of resistance - a digital shrub that grows in wisdom and holds tactics of rebellion.

    The seed is planted on March 15, 2437, at 08:02:39.
    According to Arion, the plant grows with a mixture of water and a random byte.
    A certain Boolean operation allows for these ingredients to be mixed well.
    If its growth is recorded each day for 12 days, a tactic is revealed.
    
    Format
    flag{...}


