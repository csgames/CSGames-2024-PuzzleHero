description: |
   Embrace the maple leaf spirit and stand proud under the red and white! Gather your crew, strike a pose, and snap a shot in front of the Canadian flag. Let the maple vibes flow! Share your patriotic pic in [here](https://discord.com/channels/1085360050958241852/1217729100169482400).
   <br />
   Embrassez l'esprit de la feuille d'érable et tenez fièrement sous le rouge et le blanc ! Rassemblez votre équipage, prenez la pose, et capturez l'instant devant le drapeau canadien. Laissez les vibrations de l'érable vous envahir ! Partagez votre photo patriotique [ici](https://discord.com/channels/1085360050958241852/1217729100169482400).

