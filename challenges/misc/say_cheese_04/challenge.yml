name: "Say Cheese 4"
author: "Otaphoque"
description: |
   Embrace the maple leaf spirit and stand proud under the red and white! Gather your crew, strike a pose, and snap a shot in front of a Canadian flag. Let the maple vibes flow! Share your patriotic pic [here](https://discord.com/channels/1085360050958241852/1217730690947354695). At least 6 persons from your team must be present on the picture. At least 6 persons from your team must be present on the picture.
   <br />
   Embrassez l'esprit de la feuille d'érable et tenez fièrement sous le rouge et le blanc ! Rassemblez votre équipage, prenez la pose, et capturez l'instant devant un drapeau canadien. Laissez les vibrations de l'érable vous envahir ! Partagez votre photo patriotique [ici](https://discord.com/channels/1085360050958241852/1217730690947354695). Au moins 6 personnes de votre équipe doivent être présentes sur la photo.
