name: "Say Cheese 5"
author: "Otaphoque"
description: |
   Embrace the thrill of the quest and let the sunrise be your guide! Gather your crew, step with purpose, and snap a pic at the break of dawn. Share your morning stride [here](https://discord.com/channels/1085360050958241852/1217730768231731231). At least 6 persons from your team must be present on the picture.
   <br />
   Embrassez l'excitation de la quête et laissez le lever du soleil être votre guide ! Rassemblez votre équipe, marchez avec détermination et prenez une photo à l'aube. Partagez votre pas matinal [ici](https://discord.com/channels/1085360050958241852/1217730768231731231). Au moins 6 personnes de votre équipe doivent être présentes sur la photo.
