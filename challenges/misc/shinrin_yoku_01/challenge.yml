name: "Shinrin yoku 01"
author: "Otaphoque"
description: |
   Time to touch grass! Go for a walk and really, I mean really, feel the nature around you.
   Il est l'heure de *toucher de l'herbe*! Allez marcher et vraiment, je veux dire vraiment, ressentez la nature autour de vous.
   <br />
   What animal and year can we see on the building on Windsor station?
   Quel animal et quelle année peut-on voir sur le bâtiment de la gare Windsor?
   <br />
   Format 
   flag{Animal YYYY}
flags:
   - {
        type: "static",
        content: "flag{(Beaver|Castor) 1187}",
        data: "case_insensitive",
   }
tags:
   - shinrin_yoku