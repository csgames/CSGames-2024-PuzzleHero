description: |
   Embrace the rhythm of the treasure hunt and let the YMCA guide your steps! Gather your team, dance with joy, and capture the magic in a vibrant video. Share the laughter and dance on, adventurers! Submit your jubilant masterpiece [here](https://discord.com/channels/1085360050958241852/1217729100169482400). At least 6 persons from your team must be present on the picture.
   <br />
   Adoptez le rythme de la chasse au trésor et laissez le YMCA guider vos pas ! Rassemblez votre équipe, dansez et capturez la magie dans une vidéo vibrante. Partagez le rire et dansez, aventuriers ! Soumettez votre chef-d'œuvre jubilant [ici](https://discord.com/channels/1085360050958241852/1217729100169482400). Au moins 6 personnes de votre équipe doivent être présentes sur la photo.
